[workspace]
members = ["crates/redface-core", "crates/redface-recognition", "crates/redface-record", "crates/redface-capture", "crates/redface-runtime", "crates/redfaced", "crates/redface-check", "crates/redface-toolkit", "crates/redface-lock", "crates/redface-osd", "crates/pam-redface"]
# ncnn and ncnn-bind are not workspace members: they are only pulled into the
# build graph as path dependencies when redface-recognition's `ncnn` feature is
# on (the default). Excluding them means workspace-wide OpenVINO builds
# (`cargo build --workspace --no-default-features --features openvino`) don't
# compile them or link libncnn.
exclude = ["crates/ncnn", "crates/ncnn-bind"]
resolver = "3"

[workspace.dependencies]
redface-core = { path = "crates/redface-core" }
redface-capture = { path = "crates/redface-capture" }
redface-recognition = { path = "crates/redface-recognition", default-features = false }
redface-runtime = { path = "crates/redface-runtime", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
binary_serde = {version = "1.0", features=["std"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
libc = "0.2"
log = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"